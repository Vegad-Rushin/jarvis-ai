name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  python-quality:
    name: Python quality
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install JARVIS and dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy src tests

      - name: Pytest
        run: pytest

      - name: Frontend syntax check
        run: node --check frontend/js/app.js frontend/js/config.js frontend/js/audio/player.js frontend/js/audio/recorder.js frontend/js/components/particle-field.js frontend/js/components/signal-orb.js frontend/js/components/speaking-orb.js frontend/js/gateway/client.js
